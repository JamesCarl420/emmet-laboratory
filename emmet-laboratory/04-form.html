<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Student Registration Form</title> </head> <body>
<h1>Student Registration Form</h1>

<form action="#" method="post">

    <label for="student-id">Student ID:</label>
    <input type="text" id="student-id" name="student-id" placeholder="Enter your student ID">
    <br><br>

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password">
    <br><br>

    <p>Gender:</p>

    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>

    <br><br>

    <label for="course">Course:</label>
    <select id="course" name="course">
        <option value="web">Web Technologies</option>
        <option value="it">Information Technology</option>
        <option value="cs">Computer Science</option>
    </select>

    <br><br>

    <p>Hobbies:</p>

    <input type="checkbox" id="reading" name="hobbies" value="reading">
    <label for="reading">Reading</label>

    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
    <label for="gaming">Gaming</label>

    <input type="checkbox" id="sports" name="hobbies" value="sports">
    <label for="sports">Sports</label>

    <br><br>

    <label for="address">Address:</label>
    <br>
    <textarea id="address" name="address" rows="5" cols="40" placeholder="Enter your address"></textarea>

    <br><br>

    <input type="submit" value="Register">

</form>

</body> </html>
